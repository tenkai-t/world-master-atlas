<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103f39"><title>世界マスター · 教材の修復</title><link rel="stylesheet" href="/style.css?v=12"></head><body><main class="setup"><div class="eyebrow">WORLD MASTER · RECOVERY</div><h1>記録を残して、教材を修復</h1><section class="card"><p>学習記録・プレイヤー・設定は削除しません。オンラインに戻し、ほかのタブで学習中なら終了してから実行してください。</p><p>最新版への更新にも、この修復を利用できます。</p><p>古いオフライン機能を更新し、起動に必要な基本教材だけを確認・再準備します。写真と漢字モデルは、起動後に設定から準備できます。</p><button id="repairStart" class="primary">記録を残して教材を修復する</button><progress id="repairProgress" class="offlineProgress" value="0" max="1"></progress><p id="repairMessage" role="status" aria-live="polite">修復には通信が必要です。</p><a id="repairReturn" href="/play.html">ゲームを開く</a><p class="note">処理中に画面を閉じた場合も、学習記録は残ります。失敗した場合は通信を確認して再試行できます。ブラウザデータを消す必要はありません。</p></section></main><script src="/repair.js?v=3"></script></body></html>
